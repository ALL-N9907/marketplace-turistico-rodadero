# Ejemplo: adaptar dominio, certificados y ruta del build al servidor real.
server {
    listen 443 ssl;
    server_name turismo.example.com;
    ssl_certificate /etc/ssl/rodatours/fullchain.pem;
    ssl_certificate_key /etc/ssl/rodatours/privkey.pem;
    root /var/www/rodatours/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        # Las cabeceras CSRF y cookies se reenvían por defecto. Sin caché de datos privados.
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Repetir: add_header en una location sustituye la herencia del servidor.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
    }
}

server {
    listen 80;
    server_name turismo.example.com;
    return 301 https://$host$request_uri;
}
