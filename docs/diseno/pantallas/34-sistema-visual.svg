<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Sistema visual y componentes"><title>Sistema visual y componentes</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F8F7" stroke="none"/><rect x="0" y="0" width="1440" height="84" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="51" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="750" fill="#087F80">roda</text><text x="135" y="51" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" fill="#173B3F">tours</text><text x="408" y="49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#087F80">Explorar</text><text x="520" y="49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Agencias</text><text x="636" y="49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#61777B">Mis reservas</text><text x="1070" y="49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Notificaciones</text><rect x="1220" y="20" width="155" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="1238" y="48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Mi cuenta</text><text x="64" y="139" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#173B3F">Caribe sereno · Sistema visual propuesto</text><text x="64" y="171" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">La documentación no fija identidad visual: esta dirección es una propuesta, no una decisión previa.</text><text x="64" y="965" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">RODATOURS  /  El Rodadero · Santa Marta, Colombia</text><text x="1060" y="965" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Diseño de producto · Datos de ejemplo</text><rect x="64" y="222" width="620" height="310" rx="16" fill="#FFFFFF" stroke="none"/><text x="88" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Color y tipografía</text><rect x="88" y="291" width="100" height="68" rx="10" fill="#173B3F" stroke="none"/><rect x="204" y="291" width="100" height="68" rx="10" fill="#087F80" stroke="none"/><rect x="320" y="291" width="100" height="68" rx="10" fill="#E6F4F1" stroke="none"/><rect x="436" y="291" width="100" height="68" rx="10" fill="#F47B59" stroke="none"/><text x="88" y="390" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">#173B3F   #087F80   #E6F4F1   #F47B59</text><text x="88" y="439" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="650" fill="#173B3F">Inter / Segoe UI · Aa Bb 0123</text><text x="88" y="484" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Títulos 32 / 24 / 20 · Cuerpo 16 / 14 · Ayuda 12</text><rect x="716" y="222" width="660" height="310" rx="16" fill="#FFFFFF" stroke="none"/><text x="740" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Acciones y etiquetas</text><rect x="740" y="296" width="265" height="44" rx="10" fill="#087F80" stroke="none"/><text x="758" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Acción principal</text><rect x="1026" y="296" width="326" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="1044" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Acción secundaria</text><rect x="740" y="379" width="132" height="28" rx="14" fill="#FFF2D8" stroke="none"/><text x="752" y="398" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A5B0A">Pendiente</text><rect x="890" y="379" width="132" height="28" rx="14" fill="#E6F4F1" stroke="none"/><text x="902" y="398" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#087F80">Confirmada</text><rect x="1040" y="379" width="132" height="28" rx="14" fill="#FCE9E5" stroke="none"/><text x="1052" y="398" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#AC4431">Cancelada</text><rect x="1190" y="379" width="160" height="28" rx="14" fill="#EDF1F2" stroke="none"/><text x="1202" y="398" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#61777B">Completada</text><text x="740" y="456" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">No depender sólo del color: usar texto de estado.</text><rect x="64" y="565" width="620" height="318" rx="16" fill="#FFFFFF" stroke="none"/><text x="88" y="601" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Entrada y foco</text><text x="88" y="658" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Etiqueta visible</text><rect x="88" y="670" width="548" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="103" y="700" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Contenido del campo</text><rect x="85" y="667" width="554" height="54" rx="11" fill="none" stroke="#087F80"/><text x="88" y="770" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Foco visible · Ayuda y errores junto al campo</text><text x="88" y="816" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Objetivo web: controles táctiles de al menos 44 px.</text><rect x="716" y="565" width="660" height="318" rx="16" fill="#FFFFFF" stroke="none"/><text x="740" y="601" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Espaciado y superficies</text><text x="740" y="655" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Escala: 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 px.</text><text x="740" y="692" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Radios: 10 px en controles; 16 px en tarjetas.</text><text x="740" y="729" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Escritorio: 1440 × 1000 · Móvil: 390 × 844.</text><text x="740" y="766" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Componentes nativos y Auto Layout: crear en Figma.</text><text x="740" y="803" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Estas formas SVG no incluyen variantes ni interacciones.</text></svg>