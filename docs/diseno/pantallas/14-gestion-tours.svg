ont-weight="400" fill="#173B3F">Caminata a Minca</text><text x="652" y="315" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#173B3F">$180.000</text><text x="852" y="315" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#173B3F">8 h</text><rect x="992" y="295" width="145" height="28" rx="14" fill="#E6F4F1" stroke="none"/><text x="1004" y="314" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#087F80">Activo</text><text x="1172" y="315" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#087F80">Editar →</text><rect x="284" y="342" width="1106" height="67" rx="0" fill="#FFFFFF" stroke="none"/><path d="M284 409H1390" stroke="#DCE7E4"/><text x="302" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#173B3F">Ruta cafetera</text><text x="652" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#173B3F">$150.000</text><text x="852" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#173B3F">6 h</text><rect x="992" y="362" width="145" height="28" rx="14" fill="#E6F4F1" stroke="none"/><text x="1004" y="381" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#087F80">Activo</text><text x="1172" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#087F80">Editar →</text><rect x="284" y="409" width="1106" height="67" rx="0" fill="#FFFFFF" stroke="none"/><path d="M284 476H1390" stroke="#DCE7E4"/><text x="302" y="449" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#173B3F">Sierra al amanecer</text><text x="652" y="449" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#173B3F">$220.000</text><text x="852" y="449" font-family="Inter, Sego