<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Registro y edición de guía"><title>Registro y edición de guía</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F8F7" stroke="none"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#173B3F" stroke="none"/><text x="28" y="55" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">rodatours</text><text x="28" y="85" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#A8C9C7">ESPACIO DE OPERACIÓN</text><text x="30" y="157" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Resumen</text><text x="30" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Tours</text><text x="30" y="263" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Programación</text><text x="30" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Reservas</text><rect x="16" y="342" width="212" height="43" rx="9" fill="#2B5558" stroke="none"/><text x="30" y="369" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="#FFFFFF">Guías</text><text x="30" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Perfil de agencia</text><text x="30" y="475" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Notificaciones</text><text x="28" y="920" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#BBD2D0">Operador de agencia</text><text x="28" y="951" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF">Cerrar sesión</text><rect x="244" y="0" width="1196" height="76" rx="0" fill="#FFFFFF" stroke="none"/><text x="280" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">El Rodadero / Guías</text><text x="1110" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#087F80">Operador de agencia</text><text x="284" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#173B3F">Registra un guía de tu agencia</text><text x="284" y="165" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">El operador sólo puede administrar guías pertenecientes a Sierra Viva.</text><text x="284" y="973" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Datos de ejemplo · La API determina permisos y disponibilidad.</text><rect x="284" y="216" width="1106" height="700" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Información del guía</text><text x="308" y="312" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Nombre completo</text><rect x="308" y="324" width="1058" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="354" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Camila Torres</text><text x="308" y="408" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Documento de identidad · único</text><rect x="308" y="420" width="504" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="450" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">1000000000</text><text x="836" y="408" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Registro profesional · único</text><rect x="836" y="420" width="530" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="851" y="450" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">GT-001</text><text x="308" y="504" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Correo electrónico · único</text><rect x="308" y="516" width="504" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="546" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">camila@ejemplo.com</text><text x="836" y="504" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Teléfono</text><rect x="836" y="516" width="530" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="851" y="546" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">+57 300 000 0000</text><text x="308" y="600" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Idiomas · opcional</text><rect x="308" y="612" width="504" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="642" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Español, inglés</text><text x="836" y="600" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Estado</text><rect x="836" y="612" width="530" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="851" y="642" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Activo</text><rect x="308" y="710" width="1058" height="80" rx="12" fill="#E6F4F1" stroke="none"/><text x="328" y="739" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#173B3F">Agencia: Sierra Viva</text><text x="328" y="765" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Este formulario crea el registro del guía, no su cuenta de acceso. El administrador crea la cuenta GUIDE.</text><rect x="308" y="832" width="270" height="44" rx="10" fill="#087F80" stroke="none"/><text x="326" y="860" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Guardar guía</text></svg>