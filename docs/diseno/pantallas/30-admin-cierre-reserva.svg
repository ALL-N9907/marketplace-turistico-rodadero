<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Cierre administrativo de reserva"><title>Cierre administrativo de reserva</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F8F7" stroke="none"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#173B3F" stroke="none"/><text x="28" y="55" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">rodatours</text><text x="28" y="85" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#A8C9C7">ESPACIO DE OPERACIÓN</text><text x="30" y="157" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Resumen</text><text x="30" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Agencias</text><text x="30" y="263" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Turistas</text><text x="30" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Tours</text><text x="30" y="369" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Tipos de experiencia</text><text x="30" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Programación</text><rect x="16" y="448" width="212" height="43" rx="9" fill="#2B5558" stroke="none"/><text x="30" y="475" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="#FFFFFF">Reservas</text><text x="30" y="528" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Guías</text><text x="30" y="581" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Cuentas de personal</text><text x="30" y="634" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Reportes</text><text x="28" y="920" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#BBD2D0">Administrador</text><text x="28" y="951" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF">Cerrar sesión</text><rect x="244" y="0" width="1196" height="76" rx="0" fill="#FFFFFF" stroke="none"/><text x="280" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">El Rodadero / Reservas</text><text x="1110" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#087F80">Administrador</text><text x="284" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#173B3F">Cierre de la reserva RT-1042</text><text x="284" y="165" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Ejemplo del día de la salida · Sólo se cierra una reserva confirmada.</text><text x="284" y="973" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Datos de ejemplo · La API determina permisos y disponibilidad.</text><rect x="284" y="216" width="1106" height="253" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Caminata a Minca</text><text x="308" y="278" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Ana Pérez · 2 personas · 15/01/2027 · 07:00 — 15:00</text><rect x="1200" y="243" width="160" height="28" rx="14" fill="#E6F4F1" stroke="none"/><text x="1212" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#087F80">Confirmada</text><text x="308" y="331" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173B3F">Hora de fin calculada por el servidor.</text><text x="308" y="366" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173B3F">El canje del QR y el cierre son acciones independientes.</text><text x="308" y="401" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173B3F">La fecha de salida debe permitir la transición.</text><rect x="284" y="501" width="1106" height="365" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="537" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Resultado de la experiencia</text><text x="308" y="601" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Observaciones · opcionales al completar</text><rect x="308" y="613" width="1058" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="643" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Registrar observaciones administrativas…</text><rect x="308" y="719" width="300" height="44" rx="10" fill="#087F80" stroke="none"/><text x="326" y="747" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Marcar completada</text><rect x="632" y="719" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="650" y="747" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Marcar no asistió</text><rect x="308" y="787" width="1058" height="80" rx="12" fill="#E6F4F1" stroke="none"/><text x="328" y="816" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#173B3F">Estados finales</text><text x="328" y="842" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">COMPLETED y NO_SHOW no admiten más transiciones. Confirma la acción antes de enviarla.</text></svg>