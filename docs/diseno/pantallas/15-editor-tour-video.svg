FF" stroke="#DCE7E4"/><text x="662" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Naturaleza</text><text x="308" y="486" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Precio por persona · COP</text><rect x="308" y="498" width="315" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="528" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">$180.000</text><text x="647" y="486" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Duración · horas</text><rect x="647" y="498" width="320" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="662" y="528" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">8</text><text x="308" y="578" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Descripción / itinerario</text><rect x="308" y="590" width="659" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="620" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Caminata y visita a productores locales</text><text x="308" y="670" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Condiciones / servicios incluidos</text><rect x="308" y="682" width="659" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="712" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Agua y calzado cerrado / Transporte y guía</text><text x="308" y="768" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#173B3F">Dificultad: media · Estado: activo</text><text x="308" y="802" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#173B3F">☑ Apoyo a comunidades   ☐ Prácticas ambientales</text><rect x="308" y="836" width="260" height="44" rx="10" fill="#087F80" stroke="none"/><text x="326" y="864" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Guardar cambios</text><rect x="1015" y="211" width="375" height="695" rx="16" fill="#FFFFFF" stroke="none"/><text x="1039" y="247" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Video del tour</text><text x="1039" y="273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Cloudinary · Carga directa firmada</text><rect x="1039" y="309" width="327" height="164" rx="12" fill="#E6F4F1" stroke="none"/><text x="1070" y="394" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#087F80">▶ Vista previa del video</text><text x="1039" y="520" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Un video por tour.</text><text x="1039" y="550" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">MP4, WebM o MOV.</text><text x="1039" y="580" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Máximo 50 MiB y 120 segundos.</text><text x="1039" y="610" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">El servidor verifica la carga.</text><rect x="1039" y="665" width="327" height="44" rx="10" fill="#087F80" stroke="none"/><text x="1057" y="693" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Seleccionar video</text><rect x="1039" y="725" width="327" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="1057" y="753" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Eliminar video</text><text x="1039" y="817" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Error 503: proveedor no disponible.</text><text x="1039" y="843" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">No mostrar la carga como publicada</text><text x="1039" y="869" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">hasta completar la verificación.</text></svg>