<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Salidas del guía"><title>Salidas del guía</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F8F7" stroke="none"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#173B3F" stroke="none"/><text x="28" y="55" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">rodatours</text><text x="28" y="85" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#A8C9C7">ESPACIO DE OPERACIÓN</text><rect x="16" y="130" width="212" height="43" rx="9" fill="#2B5558" stroke="none"/><text x="30" y="157" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="#FFFFFF">Mis salidas</text><text x="30" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Validar QR</text><text x="30" y="263" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Notificaciones</text><text x="28" y="920" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#BBD2D0">Guía</text><text x="28" y="951" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF">Cerrar sesión</text><rect x="244" y="0" width="1196" height="76" rx="0" fill="#FFFFFF" stroke="none"/><text x="280" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">El Rodadero / Mis salidas</text><text x="1110" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#087F80">Guía</text><text x="284" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#173B3F">Tu próxima experiencia</text><text x="284" y="165" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Camila Torres · Sólo reservas de salidas que tienes asignadas.</text><text x="284" y="973" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Datos de ejemplo · La API determina permisos y disponibilidad.</text><rect x="284" y="218" width="1106" height="211" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="254" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Caminata a Minca</text><text x="308" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">15 de enero de 2027 · 07:00 — 15:00 · Sierra Viva</text><text x="308" y="332" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#61777B">Consulta el detalle de una reserva para verificar el acceso.</text><rect x="1065" y="341" width="300" height="44" rx="10" fill="#087F80" stroke="none"/><text x="1083" y="369" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Validar QR</text><rect x="284" y="460" width="1106" height="80" rx="12" fill="#E6F4F1" stroke="none"/><text x="304" y="489" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#173B3F">Acceso acotado del guía</text><text x="304" y="515" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">No existe un listado general de reservas para guías: abre una reserva conocida o recibida por QR.</text><rect x="284" y="574" width="1106" height="282" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="610" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Cerrar experiencia · RT-1042</text><text x="308" y="636" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Disponible sólo para reservas confirmadas y cuando la fecha lo permite.</text><text x="308" y="680" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Observaciones administrativas · opcional</text><rect x="308" y="692" width="730" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="722" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">El turista asistió y realizó el recorrido.</text><rect x="1060" y="692" width="306" height="44" rx="10" fill="#087F80" stroke="none"/><text x="1078" y="720" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Marcar completada</text><text x="308" y="818" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">No asistió: acción exclusiva del administrador. El check-in no completa automáticamente.</text></svg>