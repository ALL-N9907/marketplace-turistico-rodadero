 stroke="none"/><text x="280" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">El Rodadero / Reservas</text><text x="1110" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#087F80">Operador de agencia</text><text x="284" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#173B3F">Reserva RT-1042</text><text x="284" y="165" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Caminata a Minca · 15/01/2027 · 07:00 — 15:00</text><text x="284" y="973" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Datos de ejemplo · La API determina permisos y disponibilidad.</text><rect x="284" y="216" width="1106" height="274" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Ana Pérez</text><text x="308" y="278" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">2 personas · $360.000 COP</text><rect x="1200" y="240" width="160" height="28" rx="14" fill="#FFF2D8" stroke="none"/><text x="1212" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A5B0A">Pendiente</text><text x="308" y="332" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173B3F">Estado actual: SCHEDULED · Pendiente de confirmación</text><text x="308" y="369" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173B3F">Observaciones: alimentación sin gluten.</text><text x="308" y="406" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173B3F">Creada: 23/11/2026 · Última modificación: 23/11/2026</text><rect x="284" y="518" width="1106" height="340" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="554" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Acciones permitidas al operador</text><rect x="308" y="610" width="290" height="44" rx="10" fill="#087F80" stroke="none"/><text x="326" y="638" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Confirmar reserva</text><rect x="622" y="610" width="290" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="640" y="638" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Cancelar con motivo</text><rect x="308" y="698" width="1058" height="80" rx="12" fill="#E6F4F1" stroke="none"/><text x="328" y="727" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#173B3F">La confirmación puede producir un conflicto de cupos</text><text x="328" y="753" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Ante un 409, actualiza la reserva y la disponibilidad. No muestres éxito antes de la respuesta.</text><text x="308" y="820" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Completar: administrador o guía asignado. No asistió: sólo administrador.</text></svg>