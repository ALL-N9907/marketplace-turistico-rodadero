<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Cuentas de personal y permisos"><title>Cuentas de personal y permisos</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F8F7" stroke="none"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#173B3F" stroke="none"/><text x="28" y="55" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">rodatours</text><text x="28" y="85" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#A8C9C7">ESPACIO DE OPERACIÓN</text><text x="30" y="157" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Resumen</text><text x="30" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Agencias</text><text x="30" y="263" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Turistas</text><text x="30" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Tours</text><text x="30" y="369" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Tipos de experiencia</text><text x="30" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Programación</text><text x="30" y="475" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Reservas</text><text x="30" y="528" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Guías</text><rect x="16" y="554" width="212" height="43" rx="9" fill="#2B5558" stroke="none"/><text x="30" y="581" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="#FFFFFF">Cuentas de personal</text><text x="30" y="634" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#BBD2D0">Reportes</text><text x="28" y="920" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#BBD2D0">Administrador</text><text x="28" y="951" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF">Cerrar sesión</text><rect x="244" y="0" width="1196" height="76" rx="0" fill="#FFFFFF" stroke="none"/><text x="280" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">El Rodadero / Cuentas de personal</text><text x="1110" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#087F80">Administrador</text><text x="284" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#173B3F">Alta de cuentas de personal</text><text x="284" y="165" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Sólo el administrador crea accesos de operadores, guías, coordinadores y administradores.</text><text x="284" y="973" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Datos de ejemplo · La API determina permisos y disponibilidad.</text><rect x="284" y="219" width="1106" height="675" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="255" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Nueva cuenta</text><text x="308" y="317" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Correo electrónico</text><rect x="308" y="329" width="504" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="359" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">operador@ejemplo.com</text><text x="836" y="317" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Contraseña</text><rect x="836" y="329" width="530" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="851" y="359" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">••••••••••••</text><text x="308" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Rol</text><rect x="308" y="434" width="504" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="464" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">AGENCY_OPERATOR</text><text x="836" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Agencia</text><rect x="836" y="434" width="530" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="851" y="464" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Sierra Viva</text><text x="308" y="527" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Guía · sólo para rol GUIDE</text><rect x="308" y="539" width="1058" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">No aplica al rol seleccionado</text><rect x="308" y="649" width="1058" height="80" rx="12" fill="#E6F4F1" stroke="none"/><text x="328" y="678" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#173B3F">Reglas de asociación</text><text x="328" y="704" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">GUIDE requiere guía activo de la misma agencia. ADMIN y COORDINATOR no admiten agencia ni guía.</text><rect x="308" y="785" width="260" height="44" rx="10" fill="#087F80" stroke="none"/><text x="326" y="813" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Crear cuenta</text><text x="595" y="814" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">No hay autoasignación pública de roles.</text></svg>