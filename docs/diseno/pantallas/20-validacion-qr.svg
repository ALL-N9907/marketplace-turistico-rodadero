va identificada por QR · Datos personales visibles sólo tras autorización.</text><text x="284" y="973" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Datos de ejemplo · La API determina permisos y disponibilidad.</text><rect x="284" y="222" width="514" height="636" rx="16" fill="#FFFFFF" stroke="none"/><text x="308" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Código de reserva</text><text x="308" y="284" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Entrada del lector o del código recibido.</text><rect x="308" y="328" width="466" height="218" rx="14" fill="#E6F4F1" stroke="none"/><text x="351" y="420" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#087F80">LECTURA DE QR</text><text x="350" y="459" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Integración de cámara por implementar.</text><text x="350" y="485" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">La API ya permite validar el payload.</text><text x="308" y="608" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Payload leído</text><rect x="308" y="620" width="466" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="323" y="650" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">rodatours:reservation:…</text><rect x="308" y="714" width="466" height="44" rx="10" fill="#087F80" stroke="none"/><text x="326" y="742" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Validar y registrar acceso</text><rect x="822" y="222" width="568" height="636" rx="16" fill="#FFFFFF" stroke="none"/><text x="846" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Resultado de validación</text><rect x="846" y="312" width="190" height="28" rx="14" fill="#E6F4F1" stroke="none"/><text x="858" y="331" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#087F80">Acceso registrado</text><text x="846" y="395" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#173B3F">RT-1042 · Caminata a Minca</text><text x="846" y="435" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#173B3F">15/01/2027 · 07:00 · 2 personas</text><text x="846" y="475" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#173B3F">Estado: confirmada</text><text x="846" y="515" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#173B3F">Check-in registrado por el servidor.</text><rect x="846" y="608" width="520" height="80" rx="12" fill="#E6F4F1" stroke="none"/><text x="866" y="637" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#173B3F">Canje único</text><text x="866" y="663" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Si ya se usó o no corresponde a hoy: conflicto 409.</text><text x="846" y="760" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#61777B">Código incorrecto: error 400. Sin permisos: 403.</text></svg>