<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Estados transversales de interfaz"><title>Estados transversales de interfaz</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F8F7" stroke="none"/><rect x="0" y="0" width="1440" height="84" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="51" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="750" fill="#087F80">roda</text><text x="135" y="51" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" fill="#173B3F">tours</text><text x="408" y="49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#087F80">Explorar</text><text x="520" y="49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Agencias</text><text x="636" y="49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#61777B">Mis reservas</text><text x="1070" y="49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Notificaciones</text><rect x="1220" y="20" width="155" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="1238" y="48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Mi cuenta</text><text x="64" y="139" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#173B3F">Una interfaz clara, también cuando algo falla</text><text x="64" y="171" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Biblioteca de estados reutilizables para turistas y personal autorizado.</text><text x="64" y="965" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">RODATOURS  /  El Rodadero · Santa Marta, Colombia</text><text x="1060" y="965" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#61777B">Diseño de producto · Datos de ejemplo</text><rect x="64" y="224" width="620" height="190" rx="16" fill="#FFFFFF" stroke="none"/><text x="88" y="260" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Cargando información</text><rect x="88" y="291" width="420" height="18" rx="8" fill="#DCE7E4" stroke="none"/><rect x="88" y="326" width="544" height="18" rx="8" fill="#DCE7E4" stroke="none"/><text x="88" y="379" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B">Conserva filtros y evita envíos repetidos.</text><rect x="716" y="224" width="660" height="190" rx="16" fill="#FFFFFF" stroke="none"/><text x="740" y="260" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">No hay salidas con cupos</text><text x="740" y="303" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Prueba otra fecha o reduce el número de personas.</text><text x="740" y="329" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">No mostrar salidas pasadas ni operadores inactivos.</text><rect x="740" y="351" width="260" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="758" y="379" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Cambiar fecha</text><rect x="64" y="444" width="620" height="209" rx="16" fill="#FFFFFF" stroke="none"/><text x="88" y="480" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Conflicto de disponibilidad · 409</text><text x="88" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">La salida cambió mientras reservabas.</text><text x="88" y="549" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Actualiza los cupos antes de volver a solicitar.</text><rect x="88" y="588" width="300" height="44" rx="10" fill="#087F80" stroke="none"/><text x="106" y="616" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Actualizar disponibilidad</text><rect x="716" y="444" width="660" height="209" rx="16" fill="#FFFFFF" stroke="none"/><text x="740" y="480" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Acceso no permitido · 403</text><text x="740" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">Tu cuenta no tiene permiso sobre este recurso.</text><text x="740" y="549" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">No revelar información de otras agencias o turistas.</text><rect x="740" y="588" width="260" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="758" y="616" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Volver a mi espacio</text><rect x="64" y="684" width="620" height="209" rx="16" fill="#FFFFFF" stroke="none"/><text x="88" y="720" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Entrada inválida · 400</text><text x="88" y="762" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#173B3F">Motivo de cancelación</text><rect x="88" y="774" width="548" height="48" rx="9" fill="#FFFFFF" stroke="#DCE7E4"/><text x="103" y="804" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#61777B"></text><text x="88" y="850" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#AC4431">Escribe un motivo para continuar.</text><rect x="716" y="684" width="660" height="209" rx="16" fill="#FFFFFF" stroke="none"/><text x="740" y="720" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#173B3F">Servicio no disponible · 503</text><text x="740" y="763" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">No fue posible contactar al proveedor de video.</text><text x="740" y="789" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#61777B">No se ha publicado el archivo. Puedes reintentar.</text><rect x="740" y="823" width="210" height="44" rx="10" fill="#FFFFFF" stroke="#DCE7E4"/><text x="758" y="851" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#173B3F">Reintentar</text></svg>